- type: entity
  abstract: true
  description: Did you know these things come in different colors??
  parent: ClothingUnderwearBaseButcherable
  id: ClothingUnderSocksBase
  components:  
  - type: Clothing
    slots: [socks]

# Short #
- type: entity
  parent: ClothingUnderSocksBase
  id: ClothingUnderSocksShort
  name: ankle socks
  description: "A pair of short socks, perfect for when you want to show off your footwear."
  components:
  - type: Sprite
    sprite: _Nuclear/Clothing/Under/Socks/color.rsi
    state: short-icon
  - type: Clothing
    sprite: _Nuclear/Clothing/Under/Socks/color.rsi
    clothingVisuals:
      socks:
      - state: short

# Normal #
- type: entity
  parent: ClothingUnderSocksBase
  id: ClothingUnderSocksNormal
  name: socks
  description: "A pair of basic socks, perfect for when you need to blend in with the crowd."
  components:
  - type: Sprite
    sprite: _Nuclear/Clothing/Under/Socks/color.rsi
    state: normal-icon
  - type: Clothing
    sprite: _Nuclear/Clothing/Under/Socks/color.rsi
    clothingVisuals:
      socks:
      - state: normal
  - type: TemperatureProtection
    coolingCoefficient: 0.95

