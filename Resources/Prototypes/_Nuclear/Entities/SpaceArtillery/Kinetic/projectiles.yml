# CHARON-MOD NP
- type: entity
  id: ShipRailgunProjectileBM
  name: ent-ShipRailgunProjectileBM
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 30000
        Blunt: 7500
        Heat: 3000
        Ion: 7500
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#CF0E0E"
    scale: 6
    requireNoGrid: true
    shape: triangle
  - type: TimedDespawn
    lifetime: 3
  - type: PointLight
    color: "#19AFFF"
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: PowerSink
    totalIntensity: 168000
    intensitySlope: 8
    maxIntensity: 168000
  - type: GatheringProjectile

